<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOC Triage Operations - Evaluation Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f172a;
      color: #cbd5e1;
      line-height: 1.4;
      padding: 15px;
    }
    .wrapper {
      max-width: 1600px;
      margin: 0 auto;
    }
    header {
      position: relative;
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
    }
    .badge {
      display: inline-block;
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    h1 {
      font-size: 1.6rem;
      color: #ffffff;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 4px;
    }
    .subtitle {
      color: #64748b;
      font-size: 0.85rem;
    }
    
    .nav-container {
      margin-top: 8px;
      display: flex;
      justify-content: center;
    }
    .btn-nav-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(148, 163, 184, 0.05);
      border: 1px solid #475569;
      color: #94a3b8;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s ease-in-out;
    }
    .btn-nav-back:hover {
      border-color: #cbd5e1;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }
    @media (min-width: 768px) {
      .nav-container {
        position: absolute;
        left: 0;
        top: 6px;
        margin-top: 0;
      }
    }

    /* PROMINENT FIRST-ACTION COHORT SELECTOR */
    .selector-container {
      background: #1e293b;
      border: 2px solid #7c3aed;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.15);
      text-align: center;
    }
    .step-badge {
      background: #7c3aed;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .selector-label {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cohort-select {
      background: #0f172a;
      border: 2px solid #475569;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      width: 100%;
      max-width: 400px;
      transition: all 0.20s ease-in-out;
      text-align: center;
    }
    .cohort-select:focus, .cohort-select:hover {
      border-color: #a78bfa;
      box-shadow: 0 0 12px rgba(167, 139, 250, 0.3);
    }

    .instructions-box {
      background: rgba(30, 41, 59, 0.5);
      border: 1px dashed #334155;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 0.8rem;
    }

    /* Group Container Blocks */
    .cohort-group-block {
      background: rgba(30, 41, 59, 0.2);
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      display: none; 
    }
    .cohort-group-block.visible {
      display: block;
    }
    .group-header-title {
      font-size: 1rem;
      color: #f1f5f9;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 5-Column Grid */
    .users-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    @media (max-width: 1200px) {
      .users-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      .users-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .users-grid { grid-template-columns: 1fr; }
    }

    .user-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-top: 3px solid #64748b;
    }
    
    .user-title {
      font-size: 0.88rem;
      color: #ffffff;
      font-weight: 700;
      margin-bottom: 2px;
    }
    .user-subtitle {
      font-size: 0.72rem;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .design-a { color: #38bdf8; }
    .design-b { color: #f43f5e; }
    
    .dashboard-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      background: #3b82f6;
      border: 1px solid #2563eb;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 0.78rem;
      font-weight: 700;
      text-align: center;
      transition: all 0.15s ease-in-out;
      margin-bottom: 10px;
    }
    .dashboard-btn:hover {
      background: #2563eb;
      border-color: #1d4ed8;
    }

    /* Accordion Dropdowns */
    .matrix-dropdown {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 6px;
      overflow: hidden;
    }
    .matrix-toggle-btn {
      width: 100%;
      background: none;
      border: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
      color: #94a3b8;
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
    }
    .matrix-toggle-btn:hover {
      color: #a78bfa;
    }
    .matrix-toggle-btn .left-side {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .matrix-toggle-btn .chevron {
      transition: transform 0.2s ease;
    }
    .matrix-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.2s ease-out;
      padding: 0 8px;
    }
    .matrix-dropdown.active .matrix-content {
      max-height: 180px;
      padding-bottom: 8px;
    }
    .matrix-dropdown.active .chevron {
      transform: rotate(180deg);
    }
    .matrix-dropdown.active .matrix-toggle-btn {
      border-bottom: 1px solid #1e293b;
      color: #a78bfa;
    }

    .matrix-links {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 6px;
    }
    .matrix-link {
      display: flex;
      align-items: center;
      color: #64748b;
      text-decoration: none;
      font-size: 0.72rem;
      padding: 4px 6px;
      background: rgba(255, 255, 255, 0.01);
      border-radius: 4px;
      transition: all 0.1s;
      cursor: pointer;
    }
    .matrix-link:hover {
      color: #ffffff;
      background: rgba(124, 58, 237, 0.1);
    }

    .survey-section {
      border: 1px solid #10b981;
      background: rgba(16, 185, 129, 0.03);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      text-align: center;
    }
    .survey-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 28px;
      margin-top: 14px;
    }
    .survey-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    .survey-card-title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .student-theme { color: #38bdf8; }
    .analyst-theme { color: #a78bfa; }

    .survey-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #10b981;
      border: 1px solid #059669;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 22px;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 800;
      transition: all 0.15s;
      width: 100%;
      max-width: 320px;
    }
    .survey-btn:hover {
      background: #059669;
      border-color: #047857;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
    }

    .footer-section {
      border-top: 1px solid #334155;
      background: rgba(30, 41, 59, 0.3);
      padding: 14px;
      border-radius: 8px;
    }
    .team-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      font-size: 0.8rem;
    }
    .email-link {
      color: #94a3b8;
      text-decoration: none;
    }
    .email-link:hover { color: #ffffff; text-decoration: underline; }

    /* POPUP MODAL STYLES (UNIVERSAL COMPONENT FRAME) */
    .image-modal {
      display: none; 
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }
    .modal-content-wrapper {
      position: relative;
      background: #1e293b;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #475569;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .modal-img {
      max-width: 50vw;
      max-height: 50vh;
      object-fit: contain;
      border-radius: 4px;
    }
    .modal-close {
      align-self: flex-end;
      color: #94a3b8;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
      margin-bottom: 6px;
    }
    .modal-close:hover { color: #ffffff; }

    /* SECURE PASSKEY MODAL POPUP DESIGN */
    .passkey-modal-content {
      background: #1e293b;
      border: 2px solid #7c3aed;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
      position: relative;
    }
    .passkey-header {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .passkey-desc {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-bottom: 16px;
    }
    .passkey-input {
      background: #0f172a;
      border: 1px solid #475569;
      color: #ffffff;
      font-size: 1.2rem;
      letter-spacing: 0.3em;
      padding: 10px;
      border-radius: 6px;
      width: 100%;
      text-align: center;
      outline: none;
      margin-bottom: 16px;
      font-family: monospace;
    }
    .passkey-input.error-shake {
      border-color: #ef4444;
      animation: shake 0.2s ease-in-out 2;
    }
    .passkey-btn-stack {
      display: flex;
      gap: 10px;
    }
    .passkey-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .passkey-submit {
      background: #7c3aed;
      color: #ffffff;
    }
    .passkey-submit:hover { background: #6d28d9; }
    .passkey-cancel {
      background: rgba(148, 163, 184, 0.1);
      color: #94a3b8;
      border: 1px solid #475569;
    }
    .passkey-cancel:hover { background: rgba(148, 163, 184, 0.15); color: #ffffff; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <header>
      <div class="badge">Experimental User Study</div>
      <h1>SOC Triage Operations - Evaluation Portal</h1>
      <div class="subtitle">Cohort Matrix Routing & Target Verification Hub</div>
      
      <div class="nav-container">
        <a href="index.html" class="btn-nav-back">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          Back to Training Hub
        </a>
      </div>
    </header>

    <!-- PROMINENT FIRST-ACTION COHORT SELECTOR -->
    <div class="selector-container">
      <label class="selector-label" for="cohortFilter">
        <span class="step-badge">Step 1</span> Select Your Assigned Testing Cohort:
      </label>
      <select id="cohortFilter"
